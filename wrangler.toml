name = "sww-web-app"
# Deployed as a Cloudflare Worker with static assets (the current unified
# platform @astrojs/cloudflare 14.x targets), not classic Pages —
# `pages_build_output_dir` was removed because its mere presence makes
# wrangler treat the whole config as a Pages project, which then rejects
# the adapter's own "ASSETS" static-assets binding as a reserved name.
# Deploy with: wrangler deploy --config dist/server/wrangler.json
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]

# Phase 14: QuickBooks one-way sync. Token storage only (accessToken/
# refreshToken/realmId/expiries) — never business data, so it lives in KV
# rather than the Sheet. Create the real namespace with:
#   wrangler kv namespace create QB_TOKENS
# then replace the placeholder id below with the one it prints. Local
# `astro dev`/`wrangler pages dev` works against a local Miniflare KV store
# without a real id.
[[kv_namespaces]]
binding = "QB_TOKENS"
id = "1a6b4efbf4bb493e9acb1935dec59f9b"

# Property photo uploads. Object bytes live in R2 (not the Sheet); metadata
# (property link, filename, content-type, caption) lives in a
# PropertyPhotos Sheets tab, same split QB_TOKENS uses for KV-vs-Sheet.
# Bucket created with: wrangler r2 bucket create sww-property-photos
[[r2_buckets]]
binding = "PROPERTY_PHOTOS"
bucket_name = "sww-property-photos"
